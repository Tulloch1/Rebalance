<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Rebalancer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root[data-theme="dark"] {
            --bg-base: #0B0C0E;
            --surface-card: #141619;
            --surface-elevated: #1B1E22;
            --surface-input: #101215;
            
            --border-subtle: rgba(255, 255, 255, 0.07);
            --border-hover: rgba(255, 255, 255, 0.16);
            --border-focus: #24DBA1;
            
            --text-primary: #F4F5F7;
            --text-secondary: #8E95A2;
            --text-muted: #575E6A;
            
            --accent: #24DBA1;
            --accent-hover: #1fca94;
            --accent-glow: rgba(36, 219, 161, 0.15);
            --accent-badge-bg: rgba(36, 219, 161, 0.08);
            --accent-badge-border: rgba(36, 219, 161, 0.25);
            --accent-on-text: #051A12;
            
            --danger: #F87171;
            --danger-bg: rgba(248, 113, 113, 0.08);
            --danger-border: rgba(248, 113, 113, 0.2);
            
            --warning: #FBBF24;
            --warning-bg: rgba(251, 191, 36, 0.08);
            --warning-border: rgba(251, 191, 36, 0.25);

            --track-bg: rgba(255, 255, 255, 0.06);
            --card-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5), 0 1px 2px rgba(255, 255, 255, 0.03) inset;
        }

        :root[data-theme="light"] {
            --bg-base: #F8F9FA;
            --surface-card: #FFFFFF;
            --surface-elevated: #F1F3F5;
            --surface-input: #F8F9FA;
            
            --border-subtle: #E9ECEF;
            --border-hover: #CED4DA;
            --border-focus: #14B881;
            
            --text-primary: #111317;
            --text-secondary: #5A6270;
            --text-muted: #8E95A2;
            
            --accent: #14B881;
            --accent-hover: #0FA070;
            --accent-glow: rgba(20, 184, 129, 0.18);
            --accent-badge-bg: rgba(20, 184, 129, 0.1);
            --accent-badge-border: rgba(20, 184, 129, 0.28);
            --accent-on-text: #FFFFFF;
            
            --danger: #EF4444;
            --danger-bg: #FEF2F2;
            --danger-border: #FCA5A5;
            
            --warning: #D97706;
            --warning-bg: #FFFBEB;
            --warning-border: #FCD34D;

            --track-bg: rgba(0, 0, 0, 0.06);
            --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 1px 3px rgba(0, 0, 0, 0.03);
        }

        :root {
            --radius-outer: 24px;
            --radius-card: 18px;
            --radius-input: 12px;
            --radius-btn: 12px;
            --radius-pill: 9999px;
            
            --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        /* Hide up/down number spinner arrows in all browsers */
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
            appearance: textfield;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: var(--font-sans);
            padding: 40px 16px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        .container {
            max-width: 620px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Header */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 8px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: var(--accent-badge-bg);
            border: 1px solid var(--accent-badge-border);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
        }

        .brand-icon svg {
            width: 20px;
            height: 20px;
        }

        .brand h1 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text-primary);
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-tag {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--accent);
            background: var(--accent-badge-bg);
            border: 1px solid var(--accent-badge-border);
            padding: 4px 10px;
            border-radius: var(--radius-pill);
        }

        /* Theme Toggle Button */
        .theme-toggle-btn {
            width: 34px;
            height: 34px;
            border-radius: var(--radius-pill);
            background: var(--surface-card);
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .theme-toggle-btn:hover {
            color: var(--accent);
            border-color: var(--accent-badge-border);
            background: var(--accent-badge-bg);
            transform: rotate(15deg);
        }

        .theme-toggle-btn svg {
            width: 16px;
            height: 16px;
        }

        /* Card Container */
        .card {
            background: var(--surface-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-outer);
            padding: 24px;
            box-shadow: var(--card-shadow);
            transition: background 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
        }

        /* Deposit Input Card */
        .deposit-well {
            background: var(--surface-input);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-card);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            transition: all 0.2s ease;
        }

        .deposit-well:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .deposit-label-wrap {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .deposit-label-wrap label {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .deposit-label-wrap span {
            font-size: 12px;
            color: var(--text-muted);
        }

        .deposit-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .deposit-currency {
            position: absolute;
            left: 12px;
            color: var(--accent);
            font-family: var(--font-mono);
            font-weight: 600;
            font-size: 16px;
            pointer-events: none;
        }

        .deposit-input {
            width: 140px;
            background: var(--surface-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-input);
            padding: 10px 14px 10px 28px;
            color: var(--text-primary);
            font-family: var(--font-mono);
            font-size: 16px;
            font-weight: 600;
            text-align: right;
            outline: none;
            transition: all 0.15s ease;
        }

        .deposit-input:focus {
            background: var(--surface-elevated);
            border-color: var(--accent);
        }

        /* Holdings Section */
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            padding: 0 4px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .section-title {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-secondary);
        }

        /* Minimum Purchase Input Box (Right-anchored) */
        .min-buy-well {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--surface-input);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-input);
            padding: 4px 10px;
            transition: all 0.2s ease;
        }

        .min-buy-well:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px var(--accent-glow);
        }

        .min-buy-well label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            cursor: pointer;
            white-space: nowrap;
        }

        .min-buy-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .min-buy-currency {
            position: absolute;
            left: 8px;
            color: var(--accent);
            font-family: var(--font-mono);
            font-size: 12px;
            font-weight: 600;
            pointer-events: none;
        }

        .min-buy-input {
            width: 75px;
            background: var(--surface-card);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            padding: 5px 8px 5px 20px;
            color: var(--text-primary);
            font-family: var(--font-mono);
            font-size: 13px;
            font-weight: 600;
            text-align: right;
            outline: none;
            transition: all 0.15s ease;
        }

        .min-buy-input:focus {
            background: var(--surface-elevated);
            border-color: var(--accent);
        }

        .table-headers {
            display: grid;
            grid-template-columns: 32px 1.4fr 1.3fr 1.2fr 36px;
            gap: 10px;
            padding: 8px 4px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
        }

        .holdings-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .holding-row {
            display: grid;
            grid-template-columns: 32px 1.4fr 1.3fr 1.2fr 36px;
            gap: 10px;
            align-items: center;
            background: var(--surface-input);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-card);
            padding: 8px 10px;
            transition: all 0.2s ease;
        }

        .holding-row:hover {
            border-color: var(--border-hover);
            background: rgba(255, 255, 255, 0.015);
        }

        .holding-row:focus-within {
            border-color: rgba(36, 219, 161, 0.4);
        }

        .row-index {
            font-family: var(--font-mono);
            font-size: 12px;
            font-weight: 500;
            color: var(--text-muted);
            text-align: center;
        }

        .input-group {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-prefix, .input-suffix {
            position: absolute;
            color: var(--text-muted);
            font-family: var(--font-mono);
            font-size: 13px;
            pointer-events: none;
            transition: color 0.15s ease;
        }

        .input-prefix { left: 10px; }
        .input-suffix { right: 10px; }

        .input-group:focus-within .input-prefix,
        .input-group:focus-within .input-suffix {
            color: var(--accent);
        }

        .clean-input {
            width: 100%;
            background: var(--surface-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-input);
            color: var(--text-primary);
            font-family: var(--font-mono);
            font-size: 13px;
            padding: 8px 10px;
            outline: none;
            transition: all 0.15s ease;
        }

        .clean-input::placeholder {
            color: var(--text-muted);
            opacity: 0.6;
        }

        .clean-input:focus {
            background: var(--surface-elevated);
            border-color: var(--accent);
            box-shadow: 0 0 0 2px var(--accent-glow);
        }

        .input-ticker {
            text-transform: uppercase;
            font-weight: 600;
        }

        .input-value {
            padding-left: 22px;
        }

        .input-weight {
            padding-right: 22px;
        }

        /* Delete Button */
        .btn-remove {
            width: 32px;
            height: 32px;
            border-radius: var(--radius-input);
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .btn-remove svg {
            width: 16px;
            height: 16px;
        }

        .btn-remove:hover {
            color: var(--danger);
            background: var(--danger-bg);
            border-color: var(--danger-border);
        }

        /* Target Weight Meter */
        .weight-meter-wrap {
            margin: 16px 0 24px 0;
            background: var(--surface-input);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-card);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .weight-meter-bar-bg {
            flex: 1;
            height: 6px;
            background: var(--track-bg);
            border-radius: var(--radius-pill);
            overflow: hidden;
            position: relative;
        }

        .weight-meter-bar-fill {
            height: 100%;
            background: var(--accent);
            border-radius: var(--radius-pill);
            transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.2s ease;
            box-shadow: 0 0 8px var(--accent-glow);
        }

        .weight-meter-bar-fill.warning {
            background: var(--warning);
            box-shadow: 0 0 8px rgba(251, 191, 36, 0.2);
        }

        .weight-meter-bar-fill.danger {
            background: var(--danger);
            box-shadow: 0 0 8px rgba(248, 113, 113, 0.2);
        }

        .weight-meter-label {
            font-family: var(--font-mono);
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            white-space: nowrap;
        }

        .weight-meter-label span {
            font-weight: 600;
            color: var(--accent);
        }

        /* Action Buttons */
        .actions-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-top: 8px;
        }

        .btn-left-group {
            display: flex;
            gap: 10px;
        }

        button.btn {
            font-family: var(--font-sans);
            font-size: 13px;
            font-weight: 600;
            padding: 10px 18px;
            border-radius: var(--radius-btn);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            border: 1px solid transparent;
            user-select: none;
        }

        button.btn svg {
            width: 15px;
            height: 15px;
        }

        .btn-add {
            background: var(--surface-elevated);
            color: var(--text-primary);
            border-color: var(--border-subtle);
        }

        .btn-add:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--border-hover);
        }

        .btn-reset {
            background: transparent;
            color: var(--text-muted);
            border-color: transparent;
        }

        .btn-reset:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.04);
        }

        .btn-calc {
            background: var(--accent);
            color: var(--accent-on-text);
            box-shadow: 0 4px 14px var(--accent-glow);
        }

        .btn-calc:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px var(--accent-glow);
        }

        .btn-calc:active {
            transform: translateY(0);
        }

        /* Error Banner */
        .error-banner {
            display: none;
            background: var(--danger-bg);
            border: 1px solid var(--danger-border);
            color: var(--danger);
            padding: 12px 16px;
            border-radius: var(--radius-card);
            font-size: 13px;
            font-weight: 500;
            margin-top: 16px;
        }

        /* Results Display */
        .results-section {
            display: none;
            margin-top: 10px;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Stat Grid */
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: var(--surface-input);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-card);
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .stat-box.highlight {
            border-color: var(--accent-badge-border);
            background: var(--accent-badge-bg);
        }

        .stat-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
        }

        .stat-value {
            font-family: var(--font-mono);
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .stat-box.highlight .stat-value {
            color: var(--accent);
        }

        /* Allocation Cards with Comparative Progress Bar (Kept intact in results) */
        .allocation-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .allocation-item {
            background: var(--surface-input);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-card);
            padding: 14px 18px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: all 0.15s ease;
        }

        .allocation-item.has-cut {
            border-color: var(--accent-badge-border);
            background: linear-gradient(90deg, var(--accent-badge-bg) 0%, var(--surface-input) 100%);
        }

        .allocation-item-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .asset-identity {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .ticker-badge {
            font-family: var(--font-mono);
            font-size: 13px;
            font-weight: 700;
            color: var(--text-primary);
            background: var(--surface-card);
            border: 1px solid var(--border-subtle);
            padding: 4px 10px;
            border-radius: 8px;
        }

        .asset-details {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .asset-val-preview {
            font-size: 12px;
            color: var(--text-secondary);
            font-family: var(--font-mono);
        }

        .allocation-tag-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .cut-badge {
            font-family: var(--font-mono);
            font-size: 14px;
            font-weight: 700;
            color: var(--accent);
            background: var(--accent-badge-bg);
            border: 1px solid var(--accent-badge-border);
            padding: 6px 12px;
            border-radius: var(--radius-pill);
        }

        .cut-badge.zero {
            color: var(--text-muted);
            background: transparent;
            border-color: var(--border-subtle);
            font-weight: 500;
        }

        /* Comparative Progress in Results Breakdown */
        .allocation-progress-container {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding-top: 4px;
            border-top: 1px dashed var(--border-subtle);
        }

        .allocation-progress-track {
            height: 6px;
            background: var(--track-bg);
            border-radius: var(--radius-pill);
            position: relative;
            overflow: visible;
        }

        .alloc-bar-start {
            height: 100%;
            background: rgba(36, 219, 161, 0.4);
            border-radius: var(--radius-pill) 0 0 var(--radius-pill);
            position: absolute;
            left: 0;
            top: 0;
        }

        .alloc-bar-new {
            height: 100%;
            background: var(--accent);
            border-radius: var(--radius-pill);
            position: absolute;
            left: 0;
            top: 0;
            transition: width 0.4s ease;
        }

        .alloc-target-marker {
            position: absolute;
            top: -4px;
            height: 14px;
            width: 2px;
            background: var(--text-primary);
            border-radius: 1px;
            transform: translateX(-50%);
            box-shadow: 0 0 4px rgba(0, 0, 0, 0.4);
        }

        .allocation-progress-legend {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            font-family: var(--font-mono);
            color: var(--text-secondary);
        }

        .allocation-progress-legend span strong {
            color: var(--text-primary);
        }

        /* Status Cards / Balance Notes */
        .info-pill-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
        }

        .info-pill {
            font-size: 12px;
            font-weight: 500;
            padding: 6px 12px;
            border-radius: var(--radius-pill);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--surface-input);
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
        }

        .info-pill strong {
            color: var(--text-primary);
        }

        .info-pill.balanced {
            border-color: var(--accent-badge-border);
            color: var(--accent);
            background: var(--accent-badge-bg);
        }

        /* Warning banner for low buy threshold */
        .threshold-warning {
            display: none;
            background: var(--warning-bg);
            border: 1px solid var(--warning-border);
            border-radius: var(--radius-card);
            padding: 12px 16px;
            margin-bottom: 16px;
            font-size: 13px;
            color: var(--warning);
            line-height: 1.4;
        }

        /* Collapsible ASCII Terminal Area */
        .terminal-accordion {
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-card);
            overflow: hidden;
            background: var(--surface-input);
        }

        .terminal-toggle {
            width: 100%;
            background: transparent;
            border: none;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .terminal-toggle:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.02);
        }

        .terminal-content {
            display: none;
            position: relative;
            padding: 16px;
            border-top: 1px solid var(--border-subtle);
            background: #090A0C;
        }

        pre#outputArea {
            font-family: var(--font-mono);
            font-size: 12px;
            line-height: 1.45;
            color: var(--accent);
            white-space: pre;
            overflow-x: auto;
            margin: 0;

        .btn-copy-raw {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(255, 255, 255, 0.08);

            padding: 4px 10px;
            border-radius: 6px;

            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;

        .btn-copy-raw:hover {
            background: rgba(255, 255, 255, 0.18);

        @media (max-width: 500px) {
            body {
                padding: 16px 8px;

            .card {
                padding: 16px;
                border-radius: 18px;

            .table-headers {
                grid-template-columns: 24px 1.2fr 1fr 1fr 30px;
                gap: 6px;
            }
            .holding-row {
                grid-template-columns: 24px 1.2fr 1fr 1fr 30px;
                gap: 6px;
                padding: 6px 8px;
            }
            .stat-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- Header -->
        <header class="app-header">
            <div class="brand">
                <div class="brand-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
                    </svg>
                </div>
                <div>
                    <h1>Rebalance</h1>
                </div>
            </div>
            
            <div class="header-controls">
                <button class="theme-toggle-btn" id="themeToggleBtn" title="Toggle Light/Dark Theme" onclick="toggleTheme()">
                    <!-- Sun/Moon SVG icons injected by JS -->
                </button>
                <span class="brand-tag">v1.0</span>
            </div>
        </header>

        <!-- Main Form Card -->
        <div class="card">
            
            <!-- Deposit Well -->
            <div class="deposit-well">
                <div class="deposit-label-wrap">
                    <label for="deposit">Deposit Capital</label>
                    <span>Funds available to allocate</span>
                </div>
                <div class="deposit-input-wrapper">
                    <span class="deposit-currency">$</span>
                    <input type="number" step="any" min="0" class="deposit-input" id="deposit" placeholder="0.00" oninput="saveFormData()">
                </div>
            </div>

            <!-- Holdings Section -->
            <div class="section-header">
                <span class="section-title">Portfolio Holdings</span>
                <!-- Right-anchored Minimum Purchase Input -->
                <div class="min-buy-well">
                    <label for="minBuy">Minimum Purchase</label>
                    <div class="min-buy-input-wrapper">
                        <span class="min-buy-currency">$</span>
                        <input type="number" step="any" min="0" class="min-buy-input" id="minBuy" placeholder="0" value="0" oninput="saveFormData()">
                    </div>
                </div>
            </div>

            <div class="table-headers">
                <div style="text-align: center;">#</div>
                <div>Asset / Ticker</div>
                <div>Current Value</div>
                <div>Target</div>
                <div></div>
            </div>

            <div id="portfolioContainer" class="holdings-list">
                <!-- Holding rows injected dynamically -->
            </div>

            <!-- Target Weight Meter -->
            <div class="weight-meter-wrap">
                <div class="weight-meter-bar-bg">
                    <div id="meterFill" class="weight-meter-bar-fill" style="width: 0%;"></div>
                </div>
                <div class="weight-meter-label" id="meterLabel">
                    Target Sum: <span>0%</span> / 100%
                </div>
            </div>

            <div id="errorMessage" class="error-banner"></div>

            <!-- Action Bar -->
            <div class="actions-bar">
                <div class="btn-left-group">
                    <button class="btn btn-add" onclick="addHolding()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        Add Asset
                    </button>
                    <button class="btn btn-reset" onclick="resetPage()">Reset</button>
                </div>

                <button class="btn btn-calc" onclick="calculateRebalance()">
                    Calculate Allocation
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Modern Result Dashboard -->
        <div id="resultsSection" class="results-section card">
            
            <div class="section-header">
                <span class="section-title">Rebalance Breakdown</span>
            </div>

            <!-- Stat Grid -->
            <div class="stat-grid">
                <div class="stat-box">
                    <span class="stat-label">Initial Value</span>
                    <span class="stat-value" id="statInitial">$0.00</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">Deposit</span>
                    <span class="stat-value" id="statDeposit">$0.00</span>
                </div>
                <div class="stat-box highlight">
                    <span class="stat-label">New Total Value</span>
                    <span class="stat-value" id="statNewTotal">$0.00</span>
                </div>
            </div>

            <!-- Purchase Threshold Warning (Low Deposit) -->
            <div id="thresholdWarning" class="threshold-warning">
                <!-- Dynamically populated with minBuy amount -->
            </div>

            <!-- Dynamic Allocation List with Comparative Progress Bars -->
            <div id="allocationList" class="allocation-list">
                <!-- Allocation items injected dynamically -->
            </div>

            <!-- Status Pills -->
            <div class="info-pill-container">
                <div class="info-pill" id="pillUnderweight">
                    <span>Underweight:</span> <strong id="valUnderweight">-</strong>
                </div>
                <div class="info-pill" id="pillOverweight">
                    <span>Overweight:</span> <strong id="valOverweight">-</strong>
                </div>
                <div class="info-pill" id="pillBalanced">
                    <span id="valBalanced">-</span>
                </div>
            </div>

            <!-- Collapsible Raw Terminal Output -->
            <div class="terminal-accordion">
                <button class="terminal-toggle" onclick="toggleTerminal()">
                    <span>Terminal ASCII Receipt</span>
                    <span id="toggleIcon">▼ View</span>
                </button>
                <div id="terminalContent" class="terminal-content">
                    <button class="btn-copy-raw" id="btnCopyRaw" onclick="copyOutput()">Copy</button>
                    <pre id="outputArea"></pre>
                </div>
            </div>

        </div>

    </div>

    <script>
        let holdingsData = [];

        // --- Theme Management ---
        function initTheme() {
            const savedTheme = localStorage.getItem("rebalancer_theme") || "dark";
            setTheme(savedTheme);
        }

        function setTheme(theme) {
            document.documentElement.setAttribute("data-theme", theme);
            localStorage.setItem("rebalancer_theme", theme);
            updateThemeIcon(theme);
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute("data-theme") || "dark";
            const next = current === "dark" ? "light" : "dark";
            setTheme(next);
        }

        function updateThemeIcon(theme) {
            const btn = document.getElementById("themeToggleBtn");
            if (!btn) return;
            if (theme === "dark") {
                btn.innerHTML = `
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                `;
            } else {
                btn.innerHTML = `
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                `;
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            initTheme();
            loadFormData();
        });

        function renderRows() {
            const container = document.getElementById("portfolioContainer");
            container.innerHTML = "";

            holdingsData.forEach((holding, index) => {
                const rowNum = index + 1;
                const row = document.createElement("div");
                row.className = "holding-row";
                row.id = `row_${rowNum}`;

                row.innerHTML = `
                    <div class="row-index">${rowNum}</div>
                    <div class="input-group">
                        <input type="text" class="clean-input input-ticker" id="ticker_${rowNum}" placeholder="e.g. AAPL" value="${holding.t || ''}" oninput="updateHolding(${index}, 't', this.value)">
                    </div>
                    <div class="input-group">
                        <span class="input-prefix">$</span>
                        <input type="number" step="any" min="0" class="clean-input input-value" id="value_${rowNum}" placeholder="0.00" value="${holding.v || ''}" oninput="updateHolding(${index}, 'v', this.value)">
                    </div>
                    <div class="input-group">
                        <input type="number" step="any" min="0" max="100" class="clean-input input-weight" id="weight_${rowNum}" placeholder="0" value="${holding.w || ''}" oninput="updateHolding(${index}, 'w', this.value)">
                        <span class="input-suffix">%</span>
                    </div>
                    <button class="btn-remove" title="Remove row" onclick="removeHolding(${index})">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                `;
                container.appendChild(row);
            });

            updateWeightSummary();
        }

        function updateHolding(index, field, value) {
            holdingsData[index][field] = value;
            saveFormData();
            updateWeightSummary();
        }

        function addHolding(ticker = "", value = "", weight = "") {
            holdingsData.push({ t: ticker, v: value, w: weight });
            renderRows();
            saveFormData();
        }

        function removeHolding(index) {
            if (holdingsData.length <= 1) {
                holdingsData[0] = { t: "", v: "", w: "" };
            } else {
                holdingsData.splice(index, 1);
            }
            renderRows();
            saveFormData();
        }

        function updateWeightSummary() {
            let totalWeight = 0;
            let count = 0;

            holdingsData.forEach(h => {
                const w = parseFloat(h.w);
                if (!isNaN(w)) {
                    totalWeight += w;
                    count++;
                }
            });

            const rounded = Math.round(totalWeight * 10) / 10;
            const meterFill = document.getElementById("meterFill");
            const meterLabel = document.getElementById("meterLabel");

            meterFill.style.width = `${Math.min(rounded, 100)}%`;

            if (rounded === 100) {
                meterFill.className = "weight-meter-bar-fill";
                meterLabel.innerHTML = `Target Sum: <span style="color: var(--accent);">100% ✓</span>`;
            } else if (rounded > 100) {
                meterFill.className = "weight-meter-bar-fill danger";
                meterLabel.innerHTML = `Target Sum: <span style="color: var(--danger);">${rounded}%</span> / 100%`;
            } else {
                meterFill.className = "weight-meter-bar-fill warning";
                meterLabel.innerHTML = `Target Sum: <span style="color: var(--warning);">${rounded}%</span> / 100%`;
            }
        }

        function saveFormData() {
            const deposit = document.getElementById("deposit").value;
            const minBuy = document.getElementById("minBuy").value;
            const payload = {
                deposit: deposit,
                minBuy: minBuy,
                holdings: holdingsData
            };
            localStorage.setItem("rebalancer_state", JSON.stringify(payload));
        }

        function loadFormData() {
            const saved = localStorage.getItem("rebalancer_state");
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    document.getElementById("deposit").value = data.deposit || "";
                    document.getElementById("minBuy").value = (data.minBuy !== undefined && data.minBuy !== "") ? data.minBuy : "0";
                    if (Array.isArray(data.holdings) && data.holdings.length > 0) {
                        holdingsData = data.holdings;
                    } else {
                        initDefaultHoldings();
                    }
                } catch (e) {
                    initDefaultHoldings();
                }
            } else {
                initDefaultHoldings();
            }
            renderRows();
        }

        function initDefaultHoldings() {
            holdingsData = [
                { t: "", v: "", w: "" }
            ];
        }

        function resetPage() {
            document.getElementById("deposit").value = "";
            document.getElementById("minBuy").value = "0";
            document.getElementById("resultsSection").style.display = "none";
            document.getElementById("errorMessage").style.display = "none";
            localStorage.removeItem("rebalancer_state");
            initDefaultHoldings();
            renderRows();
        }

        function showError(msg) {
            const errEl = document.getElementById("errorMessage");
            errEl.innerText = msg;
            errEl.style.display = "block";
        }

        function clearError() {
            const errEl = document.getElementById("errorMessage");
            errEl.innerText = "";
            errEl.style.display = "none";
        }

        function toggleTerminal() {
            const content = document.getElementById("terminalContent");
            const icon = document.getElementById("toggleIcon");
            if (content.style.display === "block") {
                content.style.display = "none";
                icon.innerText = "▼ View";
            } else {
                content.style.display = "block";
                icon.innerText = "▲ Hide";
            }
        }

        function copyOutput() {
            const text = document.getElementById("outputArea").innerText;
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.getElementById("btnCopyRaw");
                const prev = btn.innerText;
                btn.innerText = "Copied!";
                setTimeout(() => { btn.innerText = prev; }, 1500);
            });
        }

        // --- Core Algorithm (Ported directly from dynaReb.c with dynamic minBuy) ---
        function calculateRebalance() {
            clearError();

            const depositInput = document.getElementById("deposit").value.trim();
            const added = parseFloat(depositInput);

            if (depositInput === "" || isNaN(added) || added < 0) {
                showError("Please enter a valid deposit amount.");
                return;
            }

            const minBuyInput = document.getElementById("minBuy").value.trim();
            let minBuy = parseFloat(minBuyInput);
            if (minBuyInput === "" || isNaN(minBuy) || minBuy < 0) {
                minBuy = 0;
            }

            let validHoldings = [];
            for (let i = 0; i < holdingsData.length; i++) {
                const h = holdingsData[i];
                const ticker = (h.t || "").trim();
                const value = parseFloat(h.v);
                const weight = parseFloat(h.w);

                if (ticker === "" && isNaN(value) && isNaN(weight)) {
                    continue;
                }

                if (ticker === "" || isNaN(value) || isNaN(weight) || value < 0 || weight < 0) {
                    showError(`Please fill in valid values for holding #${i + 1}.`);
                    return;
                }

                validHoldings.push({
                    name: ticker.toUpperCase(),
                    value: value,
                    targ_weight: weight / 100.0
                });
            }

            if (validHoldings.length === 0) {
                showError("Please add at least one holding with ticker, value, and target weight.");
                return;
            }

            const res = runDynaRebAlgorithm(added, validHoldings, minBuy);

            // Populate Graphical Dashboard
            document.getElementById("statInitial").innerText = `$${res.curr_folio_value.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
            document.getElementById("statDeposit").innerText = `$${res.added.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
            document.getElementById("statNewTotal").innerText = `$${res.new_folio_value.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;

            // Threshold warning
            const warnEl = document.getElementById("thresholdWarning");
            if (res.isThresholdWarning) {
                warnEl.innerHTML = `<strong>Purchase Threshold Notice:</strong> All potential allocations were below your minimum purchase threshold ($${res.minBuy.toFixed(2)}). Entire deposit allocated to the most underweight holding.`;
                warnEl.style.display = "block";
            } else {
                warnEl.style.display = "none";
            }

            // Allocation Cards with Comparative Progress Bars
            const allocList = document.getElementById("allocationList");
            allocList.innerHTML = "";
            res.assets.forEach(a => {
                const item = document.createElement("div");
                const hasCut = a.cut > 0;
                item.className = `allocation-item ${hasCut ? 'has-cut' : ''}`;

                const initialAssetVal = a.value;
                const newAssetVal = a.value + a.cut;

                const initialPct = res.curr_folio_value > 0 ? ((initialAssetVal / res.curr_folio_value) * 100) : 0;
                const newPct = ((newAssetVal / res.new_folio_value) * 100);
                const targetPct = a.targ_weight * 100;

                item.innerHTML = `
                    <div class="allocation-item-top">
                        <div class="asset-identity">
                            <span class="ticker-badge">${a.name}</span>
                            <div class="asset-details">
                                <span class="asset-val-preview">$${initialAssetVal.toFixed(2)} → <strong>$${newAssetVal.toFixed(2)}</strong></span>
                            </div>
                        </div>
                        <div class="allocation-tag-wrap">
                            <span class="cut-badge ${hasCut ? '' : 'zero'}">
                                ${hasCut ? `+$${a.cut.toFixed(2)}` : '$0.00'}
                            </span>
                        </div>
                    </div>

                    <!-- Comparative Progress Bar (Start % -> New % vs Target %) -->
                    <div class="allocation-progress-container">
                        <div class="allocation-progress-track">
                            <div class="alloc-bar-start" style="width: ${Math.min(initialPct, 100)}%;"></div>
                            <div class="alloc-bar-new" style="width: ${Math.min(newPct, 100)}%;"></div>
                            <div class="alloc-target-marker" style="left: ${Math.min(targetPct, 100)}%;" title="Target: ${targetPct.toFixed(1)}%"></div>
                        </div>
                        <div class="allocation-progress-legend">
                            <span>Before: <strong>${initialPct.toFixed(1)}%</strong> → After: <strong style="color: var(--accent);">${newPct.toFixed(1)}%</strong></span>
                            <span>Target: <strong>${targetPct.toFixed(1)}%</strong></span>
                        </div>
                    </div>
                `;
                allocList.appendChild(item);
            });

            // Status Pills
            document.getElementById("valUnderweight").innerText = res.underweight.name;
            document.getElementById("valOverweight").innerText = res.overweight.name;

            const pillBalanced = document.getElementById("pillBalanced");
            if (res.next_deposit > 0) {
                pillBalanced.className = "info-pill";
                pillBalanced.innerHTML = `<span>Extra Needed to Balance:</span> <strong>$${res.next_deposit.toFixed(2)}</strong>`;
            } else {
                pillBalanced.className = "info-pill balanced";
                pillBalanced.innerHTML = `<strong>Portfolio Balanced ✓</strong>`;
            }

            // Raw ASCII Output
            document.getElementById("outputArea").innerText = res.rawOutput;
            document.getElementById("resultsSection").style.display = "block";
            document.getElementById("resultsSection").scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function runDynaRebAlgorithm(added, holdings, minBuy = 0) {
            const MIN_BUY = typeof minBuy === 'number' && !isNaN(minBuy) ? minBuy : 0;
            const LENIENCY = 15;
            const NEWLINE = "                                   |\n";

            function calc_upper_bound(weight) {
                return weight * (1 + LENIENCY / 100.0);
            }
            function calc_lower_bound(weight) {
                return weight * (1 - LENIENCY / 100.0);
            }

            let assets = holdings.map(h => ({
                name: h.name,
                value: h.value,
                targ_weight: h.targ_weight,
                dollars_to_targ: 0,
                cut: 0,
                up_bound: calc_upper_bound(h.targ_weight),
                low_bound: calc_lower_bound(h.targ_weight)
            }));

            let curr_folio_value = 0;
            for (let a of assets) {
                curr_folio_value += a.value;
                a.cut = 0;
            }

            let new_folio_value = curr_folio_value + added;

            // goal()
            for (let a of assets) {
                a.dollars_to_targ = (a.targ_weight * new_folio_value) - a.value;
            }

            function total_gap() {
                let folio_gap = 0;
                for (let a of assets) {
                    if (a.dollars_to_targ > 0) {
                        folio_gap += a.dollars_to_targ;
                    }
                }
                return folio_gap;
            }

            function most_overweight() {
                let max_holding = assets[0];
                for (let a of assets) {
                    if (a.dollars_to_targ < max_holding.dollars_to_targ) {
                        max_holding = a;
                    }
                }
                return max_holding;
            }

            function most_underweight() {
                let min_holding = assets[0];
                for (let a of assets) {
                    if (a.dollars_to_targ > min_holding.dollars_to_targ) {
                        min_holding = a;
                    }
                }
                return min_holding;
            }

            function first_pass_through(folio_gap, addedBudget) {
                let budget = addedBudget;
                let curr_gap = folio_gap;

                for (let a of assets) {
                    let pot_cut;
                    if (folio_gap > 0) {
                        if (a.dollars_to_targ <= 0) {
                            a.cut = 0;
                            continue;
                        }
                        pot_cut = (a.dollars_to_targ / folio_gap) * addedBudget;
                        if (pot_cut >= MIN_BUY) {
                            if (pot_cut > a.dollars_to_targ) {
                                pot_cut = a.dollars_to_targ;
                            }
                            a.cut += pot_cut;
                            a.dollars_to_targ -= pot_cut;
                            budget -= pot_cut;
                            curr_gap -= pot_cut;
                        }
                    } else {
                        pot_cut = addedBudget * a.targ_weight;
                        a.cut += pot_cut;
                        budget -= pot_cut;
                        curr_gap -= pot_cut;
                    }
                }
                return budget;
            }

            function second_pass_through(folio_gap, budget) {
                let moneyLeft = budget;
                let curr_gap = folio_gap;

                for (let a of assets) {
                    let pot_cut;
                    if (folio_gap > 0) {
                        if (a.dollars_to_targ <= 0) {
                            continue;
                        }
                        pot_cut = (a.dollars_to_targ / folio_gap) * budget;
                        if ((pot_cut >= 0 && a.cut > 0) || pot_cut >= MIN_BUY) {
                            if (pot_cut > a.dollars_to_targ) {
                                pot_cut = a.dollars_to_targ;
                            }
                            a.cut += pot_cut;
                            a.dollars_to_targ -= pot_cut;
                            moneyLeft -= pot_cut;
                            curr_gap -= pot_cut;
                        }
                    } else {
                        pot_cut = budget * a.targ_weight;
                        a.cut += pot_cut;
                        moneyLeft -= pot_cut;
                        curr_gap -= pot_cut;
                    }
                }

                let underweight = most_underweight();
                if (moneyLeft > 0.005) {
                    //underweight.cut += moneyLeft;
                    const activeAssets = assets.filter(a => a.cut > 0);
                    if (activeAssets.length > 0) {
                        let best = activeAssets[0];
                        for (let a of activeAssets) {
                            if (a.dollars_to_targ > best.dollars_to_targ) {
                                best = a;
                            }
                        }
                        best.cut += moneyLeft;
                    } else {
                        underweight.cut += moneyLeft;
                    }
                }
            }

            let folio_gap = total_gap();
            let budget = first_pass_through(folio_gap, added);
            let curr_gap = total_gap();
            second_pass_through(curr_gap, budget);

            function padLeft(str, len) {
                str = String(str);
                while (str.length < len) str = " " + str;
                return str;
            }
            function padRight(str, len) {
                str = String(str);
                while (str.length < len) str = str + " ";
                return str;
            }

            let underweight = most_underweight();
            let overweight = most_overweight();
            let isThresholdWarning = (MIN_BUY > 0 && Math.abs(underweight.cut - added) < 0.0001 && assets.length > 0 && added < MIN_BUY);

            let out = "";
            out += "___________________________________\n";
            out += "       Rebalancing Calculator\n";
            out += "___________________________________\n";
            out += `Initial Portfolio Value: ${padLeft(curr_folio_value.toFixed(2), 10)}|\n`;
            out += `Deposit Value:           ${padLeft(added.toFixed(2), 10)}|\n`;
            out += `New Portfolio Value:     ${padLeft(new_folio_value.toFixed(2), 10)}|\n`;
            out += "___________________________________|\n";
            out += "Deposit Allocation:                |\n";

            if (isThresholdWarning) {
                out += NEWLINE;
                out += "-----------------------------------|\n";
                out += "             WARNING:              |\n";
                out += "All Holdings Below Purchase        |\n";
                out += `Threshold. Allocate $${underweight.cut.toFixed(2)} To: ${underweight.name}|\n`;
                out += "-----------------------------------|\n";
                out += NEWLINE;
            }

            for (let a of assets) {
                out += `${padRight(a.name, 4)}: allocate $${padLeft(a.cut.toFixed(2), 8)}           |\n`;
            }

            out += "-----------------------------------|\n";
            out += `Most Underweight Holding: ${underweight.name}     |\n`;
            out += `Most Overweight Holding: ${overweight.name}       |\n`;

            let max_holding = most_overweight();
            let next_deposit = (max_holding.value / max_holding.targ_weight) - new_folio_value;
            if (next_deposit > 0) {
                out += "Amount Extra Needed to be Balanced:| \n";
                out += `               $${padLeft(next_deposit.toFixed(2), 8)}           |\n`;
            } else {
                out += "Portfolio is Balanced              |\n";
                out += NEWLINE;
            }
            out += "-----------------------------------\n";

            return {
                assets,
                curr_folio_value,
                new_folio_value,
                added,
                minBuy: MIN_BUY,
                underweight,
                overweight,
                next_deposit,
                isThresholdWarning,
                rawOutput: out
            };
        }
    </script>
